<section class="appointments">

    <header class="appointments-header">
        <h1>Agenda de citas</h1>

        <div class="header-controls">
            <div class="search-box">
            <mat-icon>search</mat-icon>

            <input
                type="text"
                placeholder="Buscar por título o notas..."
                [value]="searchTerm()"
                (input)="searchTerm.set($any($event.target).value)" />
        </div>

        <div
            class="view-toggle"
            [class.calendar-selected]="selectedView() === 'calendar'">

            <div class="toggle-indicator"></div>

                <button
                    type="button"
                    [class.active]="selectedView() === 'list'"
                    (click)="showList()">
                    Lista
                </button>

                <button
                    type="button"
                    [class.active]="selectedView() === 'calendar'"
                    (click)="showCalendar()">
                    Calendario
                </button>
            </div>
        </div>

        <button
          type="button"
          class="new-appointment-button"
          aria-label="Nueva cita"
          (click)="openCreateModal()">
          <mat-icon>add</mat-icon>
          <span>Nueva cita</span>
        </button>
    </header>

    <div class="view-container">

        <div
        class="view-panel"
        [class.active]="selectedView() === 'list'">
        <app-appointment-list
            [searchTerm]="searchTerm()"
            [refreshTrigger]="refreshAppointments()"
            (editAppointment)="openEditModal($event)">
        </app-appointment-list>
        </div>

        <div
        class="view-panel"
        [class.active]="selectedView() === 'calendar'">
        <app-calendar-month
            [searchTerm]="searchTerm()"
            [refreshTrigger]="refreshAppointments()"
            (editAppointment)="openEditModal($event)">
        </app-calendar-month>
        </div>
    </div>
    
    <app-appointment-modal
        *ngIf="isCreateModalOpen()"
        [appointment]="selectedAppointment()"
        (close)="closeCreateModal()"
        (saved)="onCreated()">
    </app-appointment-modal>
</section>

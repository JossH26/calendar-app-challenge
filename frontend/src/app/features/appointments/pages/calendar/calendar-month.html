<section class="calendar-panel">
  <header class="calendar-toolbar">
    <h1>Calendario mensual</h1>

    <div class="calendar-navigation" aria-label="Navegación del calendario">
      <button 
        type="button" 
        mat-icon-button aria-label="Mes anterior" 
        (click)="previousMonth()">
        <mat-icon>chevron_left</mat-icon>
      </button>

      <div class="calendar-period">
        <mat-select 
            aria-label="Mes" 
            [ngModel]="currentDate().getMonth()" 
            (ngModelChange)="changeMonth($event)"
            panelClass="calendar-period-panel">
                <mat-option 
                    *ngFor="let month of months" 
                    [value]="month.value">
                    {{ month.label }}
                </mat-option>
        </mat-select>

        <mat-select 
            aria-label="Año" 
            [ngModel]="currentDate().getFullYear()" 
            (ngModelChange)="changeYear($event)"
            panelClass="calendar-period-panel">
                <mat-option 
                *ngFor="let year of years" 
                [value]="year">
                {{ year }}
            </mat-option>
        </mat-select>
      </div>

      <button 
        type="button" 
        mat-icon-button aria-label="Mes siguiente" 
        (click)="nextMonth()">
        <mat-icon>chevron_right</mat-icon>
      </button>
    </div>

    <button 
        type="button" 
        mat-button class="today-button" 
        (click)="goToToday()">
        Hoy
    </button>
  </header>

  <div class="calendar-header">
    <div>Lun</div>
    <div>Mar</div>
    <div>Mié</div>
    <div>Jue</div>
    <div>Vie</div>
    <div>Sáb</div>
    <div>Dom</div>
  </div>

  <div class="calendar-grid">
    <div class="calendar-day" *ngFor="let day of days()">
      <ng-container *ngIf="day">
        <span class="day-number">{{ day | date:'d' }}</span>

        <div class="appointments-day-list">
          <div class="appointment-card" 
            *ngFor="let appointment of getAppointmentsByDay(day)"
            [style.--appointment-type-color]="appointment.appointment_type?.color"
            (click)="openEditModal(appointment)" 
            [matTooltip]="getAppointmentTooltip(appointment)" 
            matTooltipClass="custom-tooltip"
            matTooltipPosition="above">

            <span class="appointment-dot" aria-hidden="true"></span>
            <span class="appointment-content">
              <span class="appointment-time">
                {{ appointment.starts_at | date:'HH:mm' }}
            </span>

              <span class="appointment-title">
                {{ appointment.description }}
            </span>
            </span>

            <button 
                mat-icon-button type="button" 
                class="delete-button" 
                aria-label="Eliminar cita" 
                (click)="deleteAppointment($event, appointment.id)">
              <mat-icon>delete</mat-icon>
            </button>
          </div>
        </div>
      </ng-container>
    </div>
  </div>
</section>

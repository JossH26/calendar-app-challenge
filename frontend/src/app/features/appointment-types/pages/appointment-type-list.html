<h1>Tipos de cita</h1>

<div *ngIf="appointmentTypes().length > 0; else emptyState">
  <p *ngFor="let appointmentType of appointmentTypes()">
    {{ appointmentType.name }}
  </p>
</div>

<button type="button" (click)="openModal()">
  Nuevo tipo
</button>

<ng-template #emptyState>
  <p>No hay tipos de cita registrados.</p>
</ng-template>

<app-appointment-type-modal
  *ngIf="isModalOpen()"
  (close)="closeModal()"
  (saved)="onSaved()">
</app-appointment-type-modal>
